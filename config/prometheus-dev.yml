# Prometheus 配置 - 开发环境
# Agent 永续自进化运行系统
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'agent-evolution-monitor-dev'

scrape_configs:
  - job_name: 'agent-evolution-api'
    scrape_interval: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['agent-evolution-api-dev:8000']
    labels:
      service: 'agent-api'
      environment: 'development'

  - job_name: 'redis'
    scrape_interval: 10s
    static_configs:
      - targets: ['redis-dev:6379']
    labels:
      service: 'redis'
      environment: 'development'

  - job_name: 'postgres'
    scrape_interval: 10s
    static_configs:
      - targets: ['postgres-prod:5432']
    labels:
      service: 'postgres'
      environment: 'development'

  - job_name: 'prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9090']
    labels:
      service: 'prometheus'
      environment: 'development'
