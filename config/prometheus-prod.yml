# Prometheus 配置 - 生产环境
# Agent 永续自进化运行系统
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'agent-evolution-monitor-prod'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  - job_name: 'agent-evolution-api'
    scrape_interval: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['agent-evolution-api-prod:8000']
    labels:
      service: 'agent-api'
      environment: 'production'
    relabel_configs:
      - source_labels: [__address__]
        regex: '[^:]+'
        replacement: 8000
        target_label: __metric_relabel_configs

  - job_name: 'redis'
    scrape_interval: 10s
    static_configs:
      - targets: ['redis-prod:6379']
    labels:
      service: 'redis'
      environment: 'production'

  - job_name: 'postgres'
    scrape_interval: 10s
    static_configs:
      - targets: ['postgres-prod:5432']
    labels:
      service: 'postgres'
      environment: 'production'

  - job_name: 'prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9090']
    labels:
      service: 'prometheus'
      environment: 'production'

  - job_name: 'grafana'
    scrape_interval: 10s
    static_configs:
      - targets: ['grafana-prod:3000']
    labels:
      service: 'grafana'
      environment: 'production'

  - job_name: 'loki'
    scrape_interval: 10s
    static_configs:
      - targets: ['loki-prod:3100']
    labels:
      service: 'loki'
      environment: 'production'
