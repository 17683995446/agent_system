apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus-dev:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki-prod:3100
    editable: true

  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb-prod:8086
    database: telegraf
    editable: true
