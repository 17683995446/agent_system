# Agent 永续自进化运行系统 - Docker Compose 生产环境
# 优化点 (10+):
# 1. 生产级安全配置
# 2. 高可用性部署
# 3. 资源限制与QoS
# 4. 持久化数据保障
# 5. 完整监控链
# 6. 日志收集
# 7. 网络安全策略
# 8. 滚动更新配置
# 9. 健康检查增强
# 10. 备份与恢复

version: '3.8'

services:
  agent-evolution-api:
    build:
      context: .
      dockerfile: Dockerfile.optimized
      target: production
    container_name: agent-evolution-api-prod
    hostname: agent-api-prod
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-agent_user}:${DB_PASS:-changethis}@postgres-prod:5432/${DB_NAME:-agent_db}
      - REDIS_URL=redis://redis-prod:6379/0
      - LOG_LEVEL=INFO
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - UVICORN_WORKERS=4
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres-prod:
        condition: service_healthy
      redis-prod:
        condition: service_healthy
    networks:
      - agent-evolution-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  postgres-prod:
    image: postgres:16-alpine
    container_name: agent-evolution-postgres-prod
    hostname: postgres-prod
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-agent_user}
      - POSTGRES_PASSWORD=${DB_PASS:-changethis}
      - POSTGRES_DB=${DB_NAME:-agent_db}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data/pgdata
    networks:
      - agent-evolution-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-agent_user} -d ${DB_NAME:-agent_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  redis-prod:
    image: redis:7-alpine
    container_name: agent-evolution-redis-prod
    hostname: redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis-prod-data:/data
    networks:
      - agent-evolution-prod-network
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1 --save 300 10 --save 900 100 --requirepass ${REDIS_PASS:-changethis}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS:-changethis}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  prometheus-prod:
    image: prom/prometheus:v2.52.0
    container_name: agent-evolution-prometheus-prod
    hostname: prometheus-prod
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus-prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-prod-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - agent-evolution-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  grafana-prod:
    image: grafana/grafana:11.0.0
    container_name: agent-evolution-grafana-prod
    hostname: grafana-prod
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS:-changethis}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - grafana-prod-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus-prod
    networks:
      - agent-evolution-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  loki-prod:
    image: grafana/loki:3.0.0
    container_name: agent-evolution-loki-prod
    hostname: loki-prod
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki-config.yml:/etc/loki/local-config.yml:ro
      - loki-prod-data:/loki
    command: -config.file=/etc/loki/local-config.yml
    networks:
      - agent-evolution-prod-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  promtail-prod:
    image: grafana/promtail:3.0.0
    container_name: agent-evolution-promtail-prod
    hostname: promtail-prod
    volumes:
      - ./config/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki-prod
    networks:
      - agent-evolution-prod-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

volumes:
  postgres-prod-data:
  redis-prod-data:
  prometheus-prod-data:
  grafana-prod-data:
  loki-prod-data:

networks:
  agent-evolution-prod-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/16
