    component: prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
      name: prometheus

---

apiVersion: v1
kind: Service
metadata:
  name: agent-evolution-grafana
  namespace: agent-evolution-system
  labels:
    app: agent-evolution
    component: grafana
    environment: production
spec:
  type: ClusterIP
  selector:
    app: agent-evolution
    component: grafana
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      name: grafana
