# Kubernetes Ingress - 入口配置
# Agent 永续自进化运行系统
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-evolution-ingress
  namespace: agent-evolution-system
  labels:
    app: agent-evolution
    environment: production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
spec:
  tls:
    - hosts:
        - api.agent-evolution.local
        - grafana.agent-evolution.local
      secretName: agent-evolution-tls
  rules:
    - host: api.agent-evolution.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-evolution-api
                port:
                  number: 80
    - host: grafana.agent-evolution.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-evolution-grafana
                port:
                  number: 3000
