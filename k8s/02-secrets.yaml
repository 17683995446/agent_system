# Kubernetes Secret - 密钥管理 (示例)
# Agent 永续自进化运行系统
# 生产环境请使用加密的Secret管理工具
apiVersion: v1
kind: Secret
metadata:
  name: agent-evolution-secrets
  namespace: agent-evolution-system
  labels:
    app: agent-evolution
    environment: production
type: Opaque
stringData:
  SECRET_KEY: "your-very-secure-secret-key-please-change-in-production"
  DB_PASSWORD: "database-password-please-change"
  DB_USER: "agent_user"
  DB_NAME: "agent_db"
  REDIS_PASSWORD: "redis-password-please-change"
  GRAFANA_USER: "admin"
  GRAFANA_PASSWORD: "grafana-password-please-change"
