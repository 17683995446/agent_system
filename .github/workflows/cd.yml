# Agent 永续自进化运行系统 - 部署工作流
name: CD

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      environment:
        description: 部署环境
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: 部署到 ${{ inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: ${{ vars.DEPLOY_URL }}

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 登录到 Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        id: build_push
        with:
          context: .
          file: Dockerfile.optimized
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/agent-evolution-api:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY }}/agent-evolution-api:v${{ inputs.environment }}
            ${{ secrets.DOCKER_REGISTRY }}/agent-evolution-api:latest

      - name: 设置 Kubernetes 上下文
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: 部署到 Kubernetes
        uses: Azure/k8s-deploy@v4
        with:
          namespace: agent-evolution-system
          manifests: |
            k8s/00-namespace.yaml
            k8s/01-configmap.yaml
            k8s/02-secrets.yaml
            k8s/03-services.yaml
            k8s/04-deployments.yaml
            k8s/05-hpa.yaml
            k8s/06-ingress.yaml
            k8s/07-pdb.yaml
            k8s/08-networkpolicy.yaml
          images: |
            agent-evolution-api=${{ secrets.DOCKER_REGISTRY }}/agent-evolution-api:${{ github.sha }}
          kubectl-version: 'latest'

      - name: 等待部署完成
        run: |
          kubectl rollout status deployment/agent-evolution-api -n agent-evolution-system --timeout=5m

      - name: 发送部署成功通知
        if: ${{ success() }}
        run: |
          echo "部署成功完成！"

  rollback:
    name: 自动回滚
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy
    if: ${{ failure() }}

    steps:
      - name: 回滚到上一个版本
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: 执行回滚
        run: |
          kubectl rollout undo deployment/agent-evolution-api -n agent-evolution-system

      - name: 发送回滚通知
        run: |
          echo "部署失败，已自动回滚到上一个版本！"
